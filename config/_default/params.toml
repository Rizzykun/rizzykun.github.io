# Sections that count as posts. The homepage is a landing hub (see
# layouts/index.html) rather than a feed, but search and the widgets use this.
mainSections = ["writeups", "homelab", "projects"]
# Output page's full content in RSS.
rssFullContent = true
favicon = "/favicon.jpg"

[footer]
since = 2025
customText = "Writeups are published after the CTF ends."

[dateFormat]
published = "Jan 02, 2006"
lastUpdated = "Jan 02, 2006 15:04 MST"

[sidebar]
emoji = "🐈‍⬛"
subtitle = "CompSci @ IIUM. CTF player and challenge creator — writeups, mostly OSINT and forensics."

[sidebar.avatar]
enabled = true
local = true
src = "img/avatar.jpg"

[article]
headingAnchor = true
math = false
readingTime = true
# Related posts are surfaced by the [[indices]] rules in related.toml.

[article.license]
enabled = true
default = "CC BY-NC-SA 4.0"

## Widgets
[[widgets.homepage]]
type = "search"

[[widgets.homepage]]
type = "categories"

[widgets.homepage.params]
limit = 10

[[widgets.homepage]]
type = "tag-cloud"

[widgets.homepage.params]
limit = 12

[[widgets.page]]
type = "toc"

[opengraph.twitter]
site = ""
card = "summary_large_image"

[defaultImage.opengraph]
enabled = true
local = true
src = "img/og-default.png"

[colorScheme]
toggle = true
default = "dark"

[imageProcessing.cover]
enabled = true

[imageProcessing.content]
enabled = true

## Comments
# Disabled: the old Disqus shortname was never registered, so every article
# rendered an empty comment box. To turn comments back on, create a public
# repo, enable Discussions, install https://giscus.app, paste the ids below
# and set provider = "giscus" + enabled = true.
[comments]
enabled = false
provider = "giscus"

[comments.giscus]
repo = ""
repoID = ""
category = "Announcements"
categoryID = ""
mapping = "pathname"
lightTheme = "light"
darkTheme = "dark_dimmed"
reactionsEnabled = 1
emitMetadata = 0
